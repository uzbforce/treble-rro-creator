name: check

# The build itself needs the Android SDK (aapt2, apksigner, framework-res.apk),
# which these workflows deliberately do not install: these checks cover the
# parts that break silently — the WebUI's binary resource-table writer, the
# manifest it renders from, script syntax and documentation anchors.
#
# The desktop app is compiled twice on purpose. CGO off is the browser fallback,
# which is what the checks job exercises and what needs no C compiler. CGO on is
# the native window most people actually run: a WebView2 window on Windows and a
# GTK/WebKitGTK one on Linux. That build used to be compiled only by hand, so a
# change to window_cgo.go or a webview_go update could break it while CI stayed
# green.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The desktop app's own tests. CGO_ENABLED=0 is what stuff/tests/run.sh uses:
      # it skips the webview file, so no WebKitGTK headers are needed here —
      # and the browser fallback is the build that gets exercised.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum
          cache: true

      - name: Run the checks
        run: bash stuff/tests/run.sh

  window-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the headers the window links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum
          cache: true

      # webview_go asks pkg-config for webkit2gtk-4.0, and Ubuntu 24.04 ships
      # only 4.1. gui/build.sh writes the same two-line shim, so this job builds
      # the way a release build does instead of a way that only exists here.
      - name: Point pkg-config at webkit2gtk-4.1
        run: |
          if ! pkg-config --exists webkit2gtk-4.0; then
            shim="$RUNNER_TEMP/pkgconfig"
            mkdir -p "$shim"
            cat > "$shim/webkit2gtk-4.0.pc" <<'PC'
          Name: webkit2gtk-4.0
          Description: shim so webview_go's pkg-config name resolves to webkit2gtk-4.1
          Version: 2.40.0
          Requires: webkit2gtk-4.1
          PC
            echo "PKG_CONFIG_PATH=$shim" >> "$GITHUB_ENV"
          fi

      - name: Build the native window
        run: CGO_ENABLED=1 go build -o "$RUNNER_TEMP/treble-rro-creator-gui" ./gui

  window-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: go.sum
          cache: true

      # The runner has MinGW gcc, which is all the window build needs: the
      # WebView2 headers and loader are vendored by webview_go itself.
      - name: Build the native window (WebView2)
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "1"
          go build -o "$env:RUNNER_TEMP\treble-rro-creator-gui.exe" ./gui