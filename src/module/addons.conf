# =============================================================================
# Module addons — Treble Overlay
# =============================================================================
# The addons chosen in the desktop app (Addons tab) or in this module's page on
# the phone. Only what is listed here is enforced: the live ones are written by
# service.sh on every boot, and the overlay ones are baked into the APK by the
# next build. An addon that is not listed is left alone.
#
#   ID=VALUE      choose an addon
#   #ID=VALUE     a note, not applied
#
# Battery percentage and clock seconds are not here on purpose: those are
# Android's own Settings toggles, which a GSI already exposes.
#
# The list of ids, their choices and what each one does:
#
#   docs/addons.md
#
# Every line below is commented out on purpose: a fresh install changes nothing.
# =============================================================================

#volume_panel=left
#captive_portal=off
#stay_awake=on
#status_clock=off
#any_rotation=on
#nav_bar_padding=off
#status_bar_background=off
#hide_notch=on
